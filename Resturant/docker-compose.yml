services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: resturant-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=MyStrong!Pass123
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  web:
    build: .
    container_name: resturant-web
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__defaultDbConnect=Server=db,1433;Database=Restaurant;User Id=sa;Password=MyStrong!Pass123;TrustServerCertificate=True;Encrypt=False;
    depends_on:
      - db

volumes:
  mssql_data: